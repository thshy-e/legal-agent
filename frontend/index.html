<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><meta name="theme-color" content="#17324d">
<title>劳法智枢 · 劳动问题与维权准备</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324d'/%3E%3Ctext x='5' y='24' fill='white' font-size='24'%3E法%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/workspace.css">
<script defer src="/vendor/purify.min.js"></script><script defer src="/vendor/marked.min.js"></script>
<script defer src="/casework.js"></script><script defer src="/workspace.js"></script></head><body>
<a class="skip-link" href="#messageInput">跳转到提问</a>
<div class="app-shell" id="appShell">
<aside class="sidebar" id="sidebar" aria-label="工作区与历史对话">
<div class="brand"><span class="brand-mark" aria-hidden="true">法</span><div><strong>劳法智枢</strong><small>劳动问题与维权准备</small></div><button type="button" class="icon-button sidebar-close" aria-label="关闭导航" id="closeSidebarBtn">×</button></div>
<button class="new-chat" id="newChatBtn" type="button"><span aria-hidden="true">＋</span>新建对话</button>
<nav class="workspace-nav" aria-label="工作区"><button type="button" data-mode="auto" class="active"><span data-icon="chat"></span>法律咨询</button><button type="button" data-mode="case"><span data-icon="folder"></span>案件工作区<span class="nav-dot" id="caseDot" hidden></span></button></nav>
<div class="history-heading"><span>历史对话</span><span id="historyCount"></span></div><div class="history-list" id="historyList"></div>
<footer class="sidebar-footer"><span class="local-indicator"></span>会话保存在本机浏览器<br><span>全国与广东规则 · 广深重点适配</span><small class="build-label">工作台 v18 · 研发版</small></footer></aside>
<button type="button" class="overlay" id="sidebarOverlay" aria-label="关闭导航" hidden></button>
<main class="workspace" id="mainWorkspace">
<header class="workspace-header"><div class="header-leading"><button class="icon-button menu-button" id="mobileMenuBtn" type="button" aria-label="打开导航"><span data-icon="menu"></span></button><div><h1 id="currentModeTitle">法律咨询</h1><p id="sessionSubtitle">从问题开始，逐步理清</p></div></div><button type="button" class="quiet-button" id="openCaseBtn"><span data-icon="panel"></span><span>查看案件</span></button></header>
<section class="case-ribbon" id="caseWorkspace" hidden aria-label="当前案件摘要"></section>
<section class="chat-box" id="chatBox" aria-label="对话记录" tabindex="-1"><div class="chat-inner" id="chatInner"></div></section>
<button type="button" class="latest-button" id="streamFollowBtn" hidden>回到最新消息 ↓</button>
<footer class="input-area"><div class="input-panel"><div class="composer"><label class="sr-only" for="messageInput">你的劳动法律问题</label><textarea id="messageInput" rows="1" placeholder="说说你的情况，或继续追问…"></textarea><button type="button" class="send-button" id="sendMsgBtn" aria-label="发送"><span data-icon="arrow"></span></button></div><div class="composer-footer"><span id="composerHint">Enter 发送 · Shift + Enter 换行</span><span>法律辅助，关键结论请专业复核</span></div></div></footer></main>
<button type="button" class="overlay detail-overlay" id="detailOverlay" aria-label="关闭详情" hidden></button>
<aside class="detail-panel" id="detailPanel" aria-label="案件与法律依据" hidden><header class="detail-header"><div><span class="detail-eyebrow" id="detailEyebrow">工作资料</span><h2 id="detailTitle">当前案件</h2></div><button type="button" class="icon-button" id="closeDetailBtn" aria-label="关闭详情">×</button></header><nav class="detail-tabs" aria-label="详情内容"><button type="button" data-panel="case">当前案件</button><button type="button" data-panel="sources">法律依据</button><button type="button" data-panel="document">文书草稿</button></nav><div class="detail-content" id="detailContent"></div></aside></div>
<dialog id="unsavedDialog" aria-labelledby="unsavedTitle"><div class="dialog-content"><span class="dialog-symbol" aria-hidden="true">!</span><h2 id="unsavedTitle">还有尚未应用的事实修改</h2><p>保存会重新分析，并撤销旧金额、确认与草稿。你也可以放弃本次修改，保留已有案件。</p><div class="dialog-actions"><button type="button" data-unsaved="cancel" class="quiet-button">继续编辑</button><button type="button" data-unsaved="discard" class="quiet-button">放弃修改</button><button type="button" data-unsaved="save" class="primary-button">保存并重新分析</button></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
